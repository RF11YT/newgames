# Configuração de deploy da NewGames na Netlify.
# Este projeto é TanStack Start (Lovable) e roda em modo servidor (SSR).
# A linha NITRO_PRESET = "netlify" é o que faz ele funcionar na Netlify.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NITRO_PRESET = "netlify"
  NODE_VERSION = "20"
